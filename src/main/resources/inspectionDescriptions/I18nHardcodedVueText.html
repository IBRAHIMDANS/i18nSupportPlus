<body>
<p>Reports a text written as is in the <code>&lt;template&gt;</code> of a Vue component.</p>
<p>Example: <code>&lt;button&gt;Save&lt;/button&gt;</code>, <code>&lt;input placeholder="Name"&gt;</code>.</p>
<p>Off by default. <em>Internationalize…</em> replaces these texts by <code>$t</code> calls.</p>
<!-- tooltip end -->
<p>Runs in the editor and headless, in Qodana or <code>inspect.sh</code>.</p>
</body>
