<p>Reports an i18next plural group lacking a category its language needs.</p>
<p>Example: <code>ru/common.json</code> holding <code>item_one</code> and <code>item_other</code> only: Russian also needs <code>item_few</code> and <code>item_many</code>.</p>
<p>Only missing categories are reported, never one too many.</p>
<!-- tooltip end -->
<p>Runs in the editor and headless, in Qodana or <code>inspect.sh</code>.</p>
