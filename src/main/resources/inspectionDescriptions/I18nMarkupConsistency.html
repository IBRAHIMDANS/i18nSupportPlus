<p>Reports a translation whose markup differs from the reference locale's.</p>
<p>Example: <code>Voir &lt;1&gt;les CGU&lt;/1&gt;</code> translated <code>See &lt;1&gt;the terms</code> breaks react-i18next's <code>&lt;Trans&gt;</code>.</p>
<p>Tags are compared as a set: a language may reorder them.</p>
<!-- tooltip end -->
<p>Runs in the editor and headless, in Qodana or <code>inspect.sh</code>.</p>
