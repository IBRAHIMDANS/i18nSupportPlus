<p>Reports a translation call that does not pass a variable its message needs.</p>
<p>Example: <code>greeting = "Hello {{name}}"</code> called as <code>t('greeting')</code> shows <code>Hello {{name}}</code> in production.</p>
<p>The message is the key's value in the module's reference locale.</p>
<!-- tooltip end -->
<p>Runs in the editor and headless, in Qodana or <code>inspect.sh</code>.</p>
</body>
