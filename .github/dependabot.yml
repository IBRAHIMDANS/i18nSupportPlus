version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # One pull request a week for the minor and patch updates, so the suite runs once for them
    # instead of once per library (five runs on 2026-11-02). A major stays a pull request of its
    # own: it can break the build and is read on its own.
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
    # `core` compiles these compileOnly against the versions the IDE provides at runtime
    # (Gson 2.13.x, snakeyaml-engine 2.9 from 2025.2 to 2026.2): a newer version could bring APIs
    # the IDE lacks. jackson-core is not listed: the CLI ships its own and takes its security fixes.
    ignore:
      - dependency-name: "com.google.code.gson:gson"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.snakeyaml:snakeyaml-engine"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The `uiTest` source set pins these to the dependencies of IDE Starter (`uiTestStarterVersion`
      # in build.gradle.kts): they move with it, by hand. JUnit's are shared with the unit tests,
      # which then take JUnit updates by hand too.
      - dependency-name: "org.kodein.di:kodein-di-jvm"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm"
      - dependency-name: "org.junit.jupiter:junit-jupiter-api"
      - dependency-name: "org.junit.jupiter:junit-jupiter-engine"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    # The actions move together: one pull request, one run.
    groups:
      github-actions:
        patterns: ["*"]
