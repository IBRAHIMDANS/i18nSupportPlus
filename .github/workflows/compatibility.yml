name: Plugin Compatibility

on:
  push:
    branches: [ main ]
  schedule:
    # Run weekly to catch new IDE releases
    - cron: '0 8 * * 1'
  # Run by hand on any branch (Actions tab, or `gh workflow run compatibility.yml --ref <branch>`):
  # verifying locally downloads every IDE of the list, several GB.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # The IDEs verifyPlugin downloads fill about 25 GB of cache, more than the repository's 10 GB:
          # writing them evicts the test shards' entries. This job runs weekly and on main, so it goes uncached.
          cache-disabled: true

      - name: Build plugin
        run: ./gradlew buildPlugin -x test

      - name: Verify compatibility (recommended IDEs + 2025.2 / 2025.3 + Community 2025.2 + Android Studio 2025.3, see build.gradle.kts)
        run: ./gradlew verifyPlugin

      # The Marketplace refuses an upload over any internal API usage, whatever the "Compatible"
      # verdict says (1.18.0). The script lets through the six usages it tolerates and fails on any
      # other; the release workflow runs it too, before the upload.
      - name: Fail on internal API usages the Marketplace refuses
        run: scripts/check-internal-api.sh build/reports/pluginVerifier

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: build/reports/pluginVerifier/

  # The plugin without the JavaScript plugin, in use: IntelliJ IDEA Community opens examples/simple and the
  # tool window lists its keys. Community needs no license, unlike the WebStorm UI tests (ui-screenshots.yml).
  community-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Open the tool window in IntelliJ IDEA Community, without the JavaScript plugin
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1440x24" \
            ./gradlew verifyCommunityFlows --no-daemon --stacktrace

      - name: Upload Community flow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-ui
          path: |
            build/ui-flows-community/
            build/reports/tests/verifyCommunityFlows/
            build/test-results/verifyCommunityFlows/
