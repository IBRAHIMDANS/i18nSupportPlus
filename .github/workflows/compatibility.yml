name: Plugin Compatibility

on:
  push:
    branches: [ main ]
  schedule:
    # Run weekly to catch new IDE releases
    - cron: '0 8 * * 1'
  # Run by hand on any branch (Actions tab, or `gh workflow run compatibility.yml --ref <branch>`):
  # verifying locally downloads every IDE of the list, several GB.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build plugin
        run: ./gradlew buildPlugin -x test

      - name: Verify compatibility (recommended IDEs + 2025.1 / 2025.2, see build.gradle.kts)
        run: ./gradlew verifyPlugin

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: build/reports/pluginVerifier/
