name: Plugin Compatibility

on:
  push:
    branches: [ main ]
  schedule:
    # Run weekly to catch new IDE releases
    - cron: '0 8 * * 1'
  # Run by hand on any branch (Actions tab, or `gh workflow run compatibility.yml --ref <branch>`):
  # verifying locally downloads every IDE of the list, several GB.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # The IDEs verifyPlugin downloads fill about 25 GB of cache, more than the repository's 10 GB:
          # writing them evicts the test shards' entries. This job runs weekly and on main, so it goes uncached.
          cache-disabled: true

      - name: Build plugin
        run: ./gradlew buildPlugin -x test

      - name: Verify compatibility (recommended IDEs + 2025.2 / 2025.3 + Community 2025.2, see build.gradle.kts)
        run: ./gradlew verifyPlugin

      # The Marketplace refuses an upload over any internal API usage, whatever the "Compatible"
      # verdict says: 1.18.0 was refused over FileSizeLimit while this job was green. failureLevel
      # cannot catch it without failing every run on the six ToolWindowFactory usages Kotlin emits
      # on 2025.2, which the Marketplace tolerates (see failureLevel in build.gradle.kts). So the
      # reports are read here: those six pass, any other internal API usage fails the job.
      - name: Fail on internal API usages the Marketplace refuses
        env:
          REPORTS: build/reports/pluginVerifier
        run: |
          allowed='^Internal method com\.intellij\.openapi\.wm\.ToolWindowFactory\.(getIcon|getAnchor|manage)\(.* in (class )?com\.ibrahimdans\.i18n\.plugin\.ide\.toolwindow\.I18nToolWindowFactory[.(]'
          status=0
          while IFS= read -r -d '' report; do
            ide=${report#"$REPORTS"/}; ide=${ide%%/*}
            while IFS= read -r usage; do
              echo "::error title=Internal API usage on $ide::${usage%% This * is marked with*}"
              status=1
            done < <(grep -vE "$allowed" "$report" | grep -v '^$' || true)
          done < <(find "$REPORTS" -name internal-api-usages.txt -print0)
          exit $status

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: build/reports/pluginVerifier/
