name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Nothing is published if the Marketplace would refuse the upload: the verifier runs on the same IDEs
  # as Plugin Compatibility (compatibility.yml), and any internal API usage it does not tolerate stops
  # the release here. The gate sits on the tag, not on the release PR: Prepare Release pushes the tag
  # before it opens the PR, and a tag pushed by hand (a re-release) has no PR at all.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # The IDEs verifyPlugin downloads fill about 25 GB: too much for the runner next to a restored cache.
          cache-disabled: true

      - name: Build plugin
        run: ./gradlew buildPlugin -x test

      - name: Verify compatibility (the IDEs of build.gradle.kts, as in Plugin Compatibility)
        run: ./gradlew verifyPlugin

      - name: Fail on internal API usages the Marketplace refuses
        run: scripts/check-internal-api.sh build/reports/pluginVerifier

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-report
          path: build/reports/pluginVerifier/

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for changelog generation

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Build i18n-check
        run: ./gradlew :cli:distZip

      - name: Check that i18n-check starts
        run: |
          unzip -q cli/build/distributions/i18n-check-*.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP"/i18n-check-*/bin/i18n-check --help > /dev/null

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          IJ_HUB_TOKEN: ${{ secrets.IJ_HUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          NOTES=$(./gradlew -q printChangelogItem)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            build/distributions/*.zip
            cli/build/distributions/*.zip
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip

      - name: Upload i18n-check artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-zip
          path: cli/build/distributions/*.zip

  # The native binaries and their npm packages, built and compared with the JVM on each platform. Only
  # when npm publishing is on (NPM_PUBLISH), which it is not until someone asks for `npx`: five runners
  # for forty minutes otherwise, for packages that go nowhere.
  cli-native:
    if: vars.NPM_PUBLISH == 'true'
    uses: ./.github/workflows/cli-native.yml
    permissions:
      contents: read

  # `npx i18n-support-plus`: the packages cli-native packed, published after the release. Off until the
  # repository variable NPM_PUBLISH is `true`: the packages are first published by hand, then each one
  # trusts this workflow (npm trusted publishing), which then needs no token and signs the provenance.
  npm:
    needs: [ release, cli-native ]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # npm 11.5.1 or later publishes with the workflow's OIDC token.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm

      - name: Publish to npm
        run: npm/publish.sh "$RUNNER_TEMP/npm" --provenance

  # `ghcr.io/ibrahimdans/i18n-check`, for CI systems other than GitHub Actions. A job of its own, after the
  # release: an image that fails to build or to start leaves the plugin and the zip published. Off until
  # the repository variable DOCKER_PUBLISH is `true`: the image was published from 1.17.0 to 1.19.1 and
  # no pull or issue asked for it; `:latest` stays at the last published version until someone does.
  cli-image:
    needs: release
    if: vars.DOCKER_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ibrahimdans/i18n-check

    steps:
      - uses: actions/checkout@v7

      - name: Download i18n-check
        uses: actions/download-artifact@v8
        with:
          name: cli-zip
          path: ${{ runner.temp }}/cli-zip

      # The image is built from the released zip itself, unzipped (unzip keeps the launcher executable).
      - name: Unzip i18n-check
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          unzip -q "$RUNNER_TEMP"/cli-zip/i18n-check-*.zip -d "$RUNNER_TEMP/image"
          mv "$RUNNER_TEMP"/image/i18n-check-* "$RUNNER_TEMP/image/i18n-check"

      - name: Image tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="$IMAGE:$VERSION"
          if [[ "$VERSION" != *-beta* && "$VERSION" != *-alpha* ]]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # QEMU runs the arm64 image for its check below; building it needs none (the Dockerfile only copies).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each platform's image starts, prints its usage and reads the code of `examples/simple` with
      # tree-sitter, whose native library differs per platform. The example's problems are not the point:
      # `--max-problems` lets it exit 0, while a parse failure or a missing native library exits 2.
      - name: Check that the image starts on each platform
        run: |
          for PLATFORM in linux/amd64 linux/arm64; do
            docker buildx build --platform "$PLATFORM" --load -t i18n-check:check -f cli/Dockerfile "$RUNNER_TEMP/image"
            docker run --rm --platform "$PLATFORM" i18n-check:check --help > /dev/null
            docker run --rm --platform "$PLATFORM" -v "$PWD/examples/simple:/work" i18n-check:check --code --max-problems 100000
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
