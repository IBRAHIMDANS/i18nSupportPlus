name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for changelog generation

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Build i18n-check
        run: ./gradlew :cli:distZip

      - name: Check that i18n-check starts
        run: |
          unzip -q cli/build/distributions/i18n-check-*.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP"/i18n-check-*/bin/i18n-check --help > /dev/null

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          IJ_HUB_TOKEN: ${{ secrets.IJ_HUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          NOTES=$(./gradlew -q printChangelogItem)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            build/distributions/*.zip
            cli/build/distributions/*.zip
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip
