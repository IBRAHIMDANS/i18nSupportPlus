name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A push onto a pull request makes the run already in flight obsolete. Cancelling it there frees
# the runner instead of queueing a second full IntelliJ suite behind the first. On main every
# commit is a candidate release point, so runs on main are always allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and coverage share one job on purpose. Run apart, they each paid the same five minutes
  # to build the sandbox and execute the same ~1300 tests, and each drew independently on the
  # platform flakes that make an IntelliJ suite red — two lotteries per pull request for one
  # result. One job halves both the wall time and the exposure.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # cleanTest, so an up-to-date `test` is never skipped and the coverage report always
      # reflects this commit. --max-workers=1 stays: the platform test fixture is not safe to
      # fork, and a 2-vCPU runner has nothing to gain from parallel workers anyway.
      - name: Run tests with coverage
        run: |
          ./gradlew cleanTest test jacocoTestReport \
            --no-configuration-cache \
            --stacktrace \
            --max-workers=1

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Code Coverage'
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 70

  # The descriptor the *next* release would ship, not the one on this branch.
  #
  # Checking the branch as it stands proves nothing: pluginVersion still points at the last
  # released section, so change-notes renders that section — two entries for 1.2.1 — while the
  # release renders everything accumulated under Unreleased. That gap is why the 65 535-character
  # cap on <change-notes> was first hit by the release workflow itself, after the tag was pushed
  # and with nothing left to catch it. Patching the changelog under a throwaway version here
  # reproduces exactly what `Prepare Release` does, on every pull request.
  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Verify the descriptor the next release would ship
        run: |
          ./gradlew patchChangelog -PpluginVersion=9.9.9 --no-daemon
          ./gradlew verifyPluginStructure -PpluginVersion=9.9.9 --no-daemon --stacktrace
