name: CI

# The pages under docs/, the issue templates and the contributor guides reach no build: a change
# to them alone runs nothing, on the pull request or on main (8 of the last 150 commits, two runs
# each). README.md and CHANGELOG.md stay in: the descriptor is rendered from them. docs/img is the
# baseline of the UI screenshots, which no workflow takes. The `main-1` ruleset requires no status
# check, so a pull request with no run still merges.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'CONTRIBUTING.md'
      - 'RELEASING.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'CONTRIBUTING.md'
      - 'RELEASING.md'
      - 'LICENSE'

# A push onto a pull request makes the run already in flight obsolete. Cancelling it there frees
# the runner instead of queueing a second full IntelliJ suite behind the first. On main every
# commit is a candidate release point, so each push to main runs in a group of its own: a group
# shared by all of main holds one run pending behind the one in progress, and the next push
# cancels that pending run (3a90c5e7 never got its run on main that way).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The plugin's suite, split across four runners. In one job it took 8½ of the job's 11½
  # minutes; the fixture cannot fork (--max-workers=1), so the split is by machine. Gradle assigns
  # each test class to a shard by a stable hash of its name (`-PtestShard`, build.gradle.kts):
  # a new class always lands in exactly one shard. Shard 1 also runs the `core`, `cli` and
  # `core-treesitter` suites, which take seconds.
  #
  # Not on the pull request `Prepare Release` opens: it changes `pluginVersion` and the changelog
  # only, on the commit of main the suite has just passed, and nothing is merged until it is. The
  # `descriptor` job still checks what the release ships. A job skipped by `if:` reads as passed,
  # and the run still exists, which is what #805 needed.
  #
  # Four shards, not three: a shard costs 2 fixed minutes (cache, daemon, compilation) and the
  # suite spreads about 14 minutes of tests, so the fourth takes about 1½ minutes off the run
  # for one more runner. A shard takes 8 minutes at most; a fixture that hangs would otherwise
  # hold its runner for the 6-hour default.
  test-shard:
    if: ${{ !startsWith(github.head_ref, 'release/v') }}
    name: test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # setup-gradle keys its cache by job id. A job id with no entry yet falls back to the most
    # recent entry of any job — Plugin Compatibility's `verify`, 25 GB of IDEs, restored in 4 min
    # instead of the 3 GB the suite needs in 30 s. The shards run the build the former `test` job
    # ran, so they read (and, on main, write) its entries.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # cleanTest, so an up-to-date `test` is never skipped and the coverage data always
      # reflects this commit.
      #
      # A hung fixture leaves no trace: the job is cancelled at its timeout, before any XML
      # report of the running class is written (#817). A shard past 15 minutes is hung, not
      # slow, so a watchdog then dumps the threads of every JVM (daemon and test worker), and
      # again 3 minutes later to tell a deadlock from a slow loop; the dumps are uploaded below.
      - name: Run tests
        run: |
          tasks=":test"
          if [ "${{ matrix.shard }}" = "1" ]; then tasks="test"; fi
          (
            sleep 900
            mkdir -p build/thread-dumps
            for round in 1 2; do
              echo "::warning::Shard ${{ matrix.shard }} still running after $((15 + 3 * (round - 1))) minutes: dumping threads ($round/2)."
              for pid in $(jps -q); do
                jcmd "$pid" Thread.print -l > "build/thread-dumps/$pid-$round.txt" 2>&1 || true
              done
              [ "$round" = 1 ] && sleep 180
            done
          ) &
          watchdog=$!
          status=0
          ./gradlew cleanTest $tasks \
            -PtestShard=${{ matrix.shard }}/4 \
            --no-configuration-cache \
            --stacktrace \
            --max-workers=1 || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$status"

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-${{ matrix.shard }}
          path: build/jacoco/test.exec
          if-no-files-found: ignore

      # The report needs the exact classes the agent saw; shard 1's are those of this commit.
      - name: Upload compiled classes
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: main-classes
          path: build/classes/kotlin/main/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: build/test-results/test/*.xml
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.shard }}
          path: build/reports/tests/test/

      - name: Upload thread dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-dumps-${{ matrix.shard }}
          path: build/thread-dumps/
          if-no-files-found: ignore

  # Named `test`, the check the pull request waits on. It merges the shards' coverage and
  # comments it. `if: always()` and the first step matter: a job that `needs` a failed shard is
  # otherwise skipped, and a skipped check reads as passed. Skipped on purpose on a release pull
  # request, like the shards.
  test:
    needs: test-shard
    if: ${{ always() && !startsWith(github.head_ref, 'release/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      JACOCO_VERSION: '0.8.15'
    steps:
      - name: Fail when a shard did not pass
        if: needs.test-shard.result != 'success'
        run: |
          echo "A test shard ended with '${{ needs.test-shard.result }}': see the 'test shard' jobs."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-exec-*
          path: shards

      - name: Download compiled classes
        uses: actions/download-artifact@v8
        with:
          name: main-classes
          path: classes

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: results

      # The JaCoCo version Gradle's plugin uses, so the report reads the shards' data as
      # jacocoTestReport did.
      - name: Merge coverage and write the report
        run: |
          curl -fsSL -o jacococli.jar \
            "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/${JACOCO_VERSION}/org.jacoco.cli-${JACOCO_VERSION}-nodeps.jar"
          java -jar jacococli.jar merge shards/*/test.exec --destfile merged.exec
          mkdir -p build/reports/jacoco/test
          java -jar jacococli.jar report merged.exec \
            --classfiles classes \
            --sourcefiles src/main/kotlin \
            --name 'i18n Support Plus' \
            --xml build/reports/jacoco/test/jacocoTestReport.xml \
            --html build/reports/jacoco/test/html 2>&1 | tee report.log
          mismatched=$(grep -c "does not match" report.log || true)
          echo "Classes whose coverage data does not match the compiled class: $mismatched"

      # test-retry reruns a failed test once in CI, and a test that passes on its second run leaves
      # the shard green. Gradle writes each run as its own <testcase> (failure, then success), so a
      # (class, name) pair holding both a failed and a passed run is a test that only passed on
      # retry: counted in its own column and named in a warning, so a new flake shows up instead
      # of hiding behind the retry. <flakyFailure> covers the merged form (junitXml.mergeReruns).
      - name: Summarise the shards
        run: |
          python3 - <<'EOF'
          import glob, os
          import xml.etree.ElementTree as ET

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          print("| Shard | Test classes | Tests | Failures | Skipped | Passed on retry | Time (s) |", file=summary)
          print("|---|---|---|---|---|---|---|", file=summary)
          retried = []
          for directory in sorted(glob.glob("results/test-results-*")):
              shard = directory.rsplit("-", 1)[-1]
              classes = tests = failures = skipped = 0
              time = 0.0
              runs = {}
              for path in glob.glob(os.path.join(directory, "*.xml")):
                  suite = ET.parse(path).getroot()
                  classes += 1
                  tests += int(suite.get("tests", 0))
                  failures += int(suite.get("failures", 0))
                  skipped += int(suite.get("skipped", 0))
                  time += float(suite.get("time", 0))
                  for case in suite.iter("testcase"):
                      key = (case.get("classname"), case.get("name"))
                      failed, passed = runs.get(key, (False, False))
                      if case.find("failure") is not None or case.find("error") is not None:
                          failed = True
                      elif case.find("skipped") is None:
                          passed = True
                          if case.find("flakyFailure") is not None or case.find("flakyError") is not None:
                              failed = True
                      runs[key] = (failed, passed)
              flaky = sorted(key for key, (failed, passed) in runs.items() if failed and passed)
              retried += [(shard, key) for key in flaky]
              print(f"| {shard} | {classes} | {tests} | {failures} | {skipped} | {len(flaky)} | {time:.0f} |", file=summary)
          # Workflow commands are read from the step's output, not from the summary file.
          for shard, (classname, name) in retried:
              print(f"::warning title=Passed on retry::{classname}.{name} failed, then passed on retry (shard {shard})")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Code Coverage'
          update-comment: true
          min-coverage-overall: 60
          min-coverage-changed-files: 70

  # detekt over the main sources of the four modules, with type resolution (config/detekt/detekt.yml).
  # Fails on a finding its module's baseline does not hold: the code that predates the rules passes,
  # new code is held to them. Apart from the shards, so a lint failure reads as such.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The shards' cache holds the IDE the plugin's analysis resolves types against. Read-only: the
    # shards write it on main.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Run detekt
        run: ./gradlew detektMain --continue

      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'

  # The descriptor the *next* release would ship, not the one on this branch.
  #
  # Checking the branch as it stands proves nothing: pluginVersion still points at the last
  # released section, so change-notes renders that section — two entries for 1.2.1 — while the
  # release renders everything accumulated under Unreleased. That gap is why the 65 535-character
  # cap on <change-notes> was first hit by the release workflow itself, after the tag was pushed
  # and with nothing left to catch it. Patching the changelog under a throwaway version here
  # reproduces exactly what `Prepare Release` does, on every pull request.
  descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # Two builds, not one: `changeNotes` reads the changelog when the build is configured, so
      # the patch has to be a build of its own. The daemon the first one starts serves the second.
      - name: Verify the descriptor the next release would ship
        run: |
          ./gradlew patchChangelog -PpluginVersion=9.9.9
          ./gradlew verifyPluginStructure -PpluginVersion=9.9.9 --stacktrace
