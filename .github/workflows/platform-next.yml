name: Next Platform Tests

# The plugin's suite against the newest IDE branch of the supported range (pluginUntilBuild), while
# the default build and CI stay on platformVersion. verifyPlugin (compatibility.yml) checks the
# binary against these IDEs; this job compiles the sources and runs the tests there, which is what
# catches a defect only that platform has (the 2026.2 folding NPE of #839).
#
# Not on pull requests: it never blocks a merge. Weekly, an hour after Plugin Compatibility, and by
# hand on any branch: `gh workflow run platform-next.yml --ref <branch> -f platformVersion=2026.2.4`.
# One class alone, to read its failure without the whole suite: add `-f tests=ArbCataloguesTest`.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      platformVersion:
        description: 'IntelliJ IDEA Ultimate version to compile and test against'
        required: false
        default: '2026.2.4'
      tests:
        description: 'Test filter passed to --tests (for example ArbCataloguesTest); empty runs the whole suite'
        required: false
        default: ''

jobs:
  test:
    name: tests on ${{ inputs.platformVersion || '2026.2.4' }}
    runs-on: ubuntu-latest
    # The suite takes about 14 minutes on one runner (it is split in four in ci.yml).
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PLATFORM_VERSION: ${{ inputs.platformVersion || '2026.2.4' }}
      TEST_FILTER: ${{ inputs.tests }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # A second IDE (and the per-branch plugins) in the repository's 10 GB cache would evict the
          # test shards' entries, as compatibility.yml found. Weekly, so it goes uncached.
          cache-disabled: true

      - name: Compile against the next platform
        run: ./gradlew compileKotlin compileTestKotlin -PplatformVersion="$PLATFORM_VERSION" --stacktrace

      - name: Run the plugin's tests
        run: ./gradlew :test -PplatformVersion="$PLATFORM_VERSION" --no-configuration-cache --max-workers=1 ${TEST_FILTER:+--tests "$TEST_FILTER"}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-platform-test-results
          path: build/test-results/test/
          if-no-files-found: ignore
