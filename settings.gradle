pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// Auto-provision JDK 21 if not installed locally (required for IntelliJ 2024.2+)
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

rootProject.name = 'i18n Support Plus'

// Code that compiles without the IntelliJ Platform: a dependency on it fails this module's build.
include 'core'
// Reads source keys with tree-sitter, outside the IDE: never shipped by the plugin.
include 'core-treesitter'
